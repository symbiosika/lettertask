name: Android (Machbarkeitstest)

# Manually started: builds a debug-signed APK (arm64) of the demo build.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Android-NDK
        run: sdkmanager "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version "^2" --locked
      - name: APK bauen
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        working-directory: src-tauri
        run: cargo tauri android build --apk --target aarch64 --ci
      # Unsigned release APKs cannot be installed; sign with a throwaway key.
      - name: Signieren (Debug-Schlüssel)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -validity 365 -dname "CN=lettertask debug"
          "$BT/zipalign" -f 4 src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out lettertask-android-demo.apk aligned.apk
      - uses: actions/upload-artifact@v7
        with:
          path: lettertask-android-demo.apk
          archive: false
