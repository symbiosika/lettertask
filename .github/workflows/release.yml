name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Google-OAuth-Client (Desktop-App) für „Mit Google anmelden“, wird
          # beim Bauen fest eingebaut. Fehlen die Secrets, trägt man ihn in
          # den Einstellungen ein.
          LETTERTASK_GOOGLE_CLIENT_ID: ${{ secrets.LETTERTASK_GOOGLE_CLIENT_ID }}
          LETTERTASK_GOOGLE_CLIENT_SECRET: ${{ secrets.LETTERTASK_GOOGLE_CLIENT_SECRET }}
        with:
          projectPath: src-tauri
          # Tag push: release for that tag. Manual run: release for the app version
          # (tag v<version> is created when the draft is published).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "lettertask v__VERSION__"
          releaseDraft: true
      # Each installer as its own artifact, downloadable as the file itself
      # (no ZIP): upload-artifact v7 with archive: false takes exactly one file.
      - name: Installer-Dateien finden
        id: files
        shell: bash
        run: |
          pick() { ls target/release/bundle/$1 2>/dev/null | head -n 1; }
          {
            echo "deb=$(pick 'deb/*.deb')"
            echo "appimage=$(pick 'appimage/*.AppImage')"
            echo "msi=$(pick 'msi/*.msi')"
            echo "exe=$(pick 'nsis/*.exe')"
            echo "dmg=$(pick 'dmg/*.dmg')"
          } >> "$GITHUB_OUTPUT"
      - if: steps.files.outputs.deb != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.deb }}
          archive: false
      - if: steps.files.outputs.appimage != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.appimage }}
          archive: false
      - if: steps.files.outputs.msi != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.msi }}
          archive: false
      - if: steps.files.outputs.exe != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.exe }}
          archive: false
      - if: steps.files.outputs.dmg != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.dmg }}
          archive: false
