[package]
name = "lettertask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Classic Outlook-style mail & calendar client for Microsoft 365 (Graph API)"
default-run = "lettertask"

[lib]
name = "lettertask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mailcore = { path = "../crates/core", default-features = false }
graph-fake = { path = "../crates/graph-fake" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio.workspace = true
base64.workspace = true
serde_json.workspace = true
async-trait.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# The keyring crate has no Android/iOS backend.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mailcore = { path = "../crates/core", features = ["keyring"] }
