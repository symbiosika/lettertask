[package]
name = "mailcore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Microsoft Graph mail/calendar client core: auth, sync, local cache, service layer"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
chrono.workspace = true
thiserror.workspace = true
base64.workspace = true
url.workspace = true
uuid.workspace = true
tracing.workspace = true
rusqlite.workspace = true
async-trait.workspace = true
futures.workspace = true
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
html-escape = "0.2"
regex = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }

[features]
default = ["keyring"]

[dev-dependencies]
graph-fake = { path = "../graph-fake" }
tempfile = "3"
urlencoding = "2"
