[package]
name = "graph-fake"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-memory fake of the Microsoft Graph v1.0 mail/calendar subset and Entra OAuth endpoints"

[lib]
path = "src/lib.rs"

[[bin]]
name = "graph-fake"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
uuid = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
sha2 = "0.10"
percent-encoding = "2"

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
base64 = { workspace = true }
sha2 = "0.10"
url = { workspace = true }
